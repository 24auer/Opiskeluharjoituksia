<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shoutout manne</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* asettelun korjaus: sivupalkki vasemmalla, tehtäväkortti keskellä pääaluetta */
  @media (min-width:801px){
    body { display:grid !important; grid-template-columns:280px minmax(0,1fr) !important; align-items:start; }
    header.topbar { grid-column:1 / -1; }
    aside { grid-column:1; }
    main { grid-column:2; min-width:0; display:flex !important; flex-direction:column; align-items:center; }
    main > .card, main > .nav { width:100%; max-width:900px; }
  }
</style>
<style>
  /* tilavärit: vihreä = osaan, keltainen = en osannut, punainen = ei tehty */
  .qlist button.todo { border-color:#ef4444 !important; color:#fca5a5 !important; }
  .qlist button.review { background:#facc15 !important; border-color:#facc15 !important; color:#000 !important; }
  .qlist button.done { background:#15803d !important; border-color:#22c55e !important; color:#fff !important; }
  .card.review { border-color:#f97316 !important; background:rgba(249,115,22,.14) !important; }
  .legend { display:flex; flex-direction:column; gap:6px; font-size:12px; color:#c9a0bd; margin:14px 0; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; vertical-align:middle; }
  .dot.g { background:#22c55e; } .dot.y { background:#facc15; } .dot.r { background:#ef4444; }
</style>
</head>
<body>

<header class="topbar">
  <span class="code">TVT26SP</span>
  <span class="title">Opiskeluharjoituksia</span>
</header>

<!-- kuka siellä nurkassa vaanii... -->
<img id="gnomecorner" src="img/gnomed.png" alt="gnome" width="96" height="96">

<div id="prank" class="hidden"><div class="prank-text">miksi painoit häntä</div></div>
<aside>
  <h2>Aiheet</h2>
  <div id="cats"></div>
  <details data-key="tasks" open>
    <summary>Tehtävät</summary>
    <input id="search" class="search" placeholder="Hae tunnuksella, esim. M12 tai D5" spellcheck="false">
    <div id="qlist" class="qlist"></div>
  </details>
  <div class="legend">
    <span><i class="dot g"></i>osaan</span>
    <span><i class="dot y"></i>en osannut</span>
    <span><i class="dot r"></i>ei tehty</span>
  </div>
  <div class="progwrap">
    <div class="progbar"><span id="progfill"></span></div>
    <p class="progtext">Valmiina <span id="progress">0/33</span></p>
    <button id="resetprog" class="resetbtn">Nollaa edistyminen</button>
  </div>
</aside>

<main>
  <div class="card" id="card"></div>
  <div class="nav">
    <button class="ghost" id="prev">← Edellinen</button>
    <button class="ghost" id="next">Seuraava →</button>
  </div>
</main>

<script src="js/programming-data.js"></script>
<script src="js/digital-data.js"></script>
<script src="js/draw.js"></script>
<script src="js/digital-tasks.js"></script>
<script src="js/digital-extra.js"></script>
<script src="js/math-data.js"></script>
<script src="js/app.js"></script>
<footer class="botbar">Jos löytyy väärä tai järjetön vastaus, pistäkää Discord DM @hazemil tai &nbsp;&nbsp;<a href="mailto:mikke.laurinolli@gmail.com?subject=korjaa%20paska">email</a>&nbsp;&nbsp;||&nbsp;&nbsp;emilaur 2026 rotat</footer>
</body>
</html>
